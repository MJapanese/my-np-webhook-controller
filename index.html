<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macrodroid Controller</title>
    <style>
        :root {
            --bg-color: #c4a9d4;
            --card-bg: #1e1e1e;
            --card-border: #00e5ff;
            --text-color: #ffffff;
            --button-color: #e53935;
            --button-text: #ffffff;
            --title-shadow: 0 0 8px var(--card-border);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 450px;
        }
        .main-title {
            font-size: 2.5em;
            font-weight: bold;
            text-align: center;
            margin-bottom: 25px;
            text-shadow: var(--title-shadow);
        }
        .action-card {
            background-color: var(--card-bg);
            border: 3px solid var(--card-border);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .action-card h2 {
            margin-top: 0;
            font-size: 1.4em;
            text-align: center;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9em;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #555;
            background-color: #f0f0f0;
            color: #111;
            box-sizing: border-box;
            font-size: 1em;
        }
        .button, .test-button {
            display: block;
            width: 100%;
            padding: 12px;
            font-size: 1.1em;
            font-weight: bold;
            color: var(--button-text);
            background-color: var(--button-color);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: transform 0.1s ease;
        }
        .button:active, .test-button:active {
            transform: scale(0.97);
        }
        .button-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
        }
        .footer p {
            color: #000;
        }
        .footer a {
            color: #0d47a1;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="main-title">Macrodroid Automation</h1>

        <!-- Touch Actions Card -->
        <div class="action-card">
            <h2>Touch Actions Via</h2>
            <div class="input-group">
                <label for="x-location">X Location:</label>
                <input type="number" id="x-location" placeholder="e.g., 540">
            </div>
            <div class="input-group">
                <label for="y-location">Y Location:</label>
                <input type="number" id="y-location" placeholder="e.g., 1200">
            </div>
            <button class="test-button" onclick="handleTouch()">Test</button>
        </div>

        <!-- Other Cards -->
        <div class="action-card">
            <h2>Display Dialog</h2>
            <input type="text" id="dialog-title" placeholder="Title" class="input-group">
            <input type="text" id="dialog-desc" placeholder="Description" class="input-group">
            <button class="test-button" onclick="handleDialog()">Test</button>
        </div>

        <div class="action-card">
            <h2>Popup (Toast)</h2>
            <input type="text" id="popup-input" placeholder="Input" class="input-group">
            <button class="test-button" onclick="handlePopup()">Test</button>
        </div>

        <div class="action-card">
            <h2>Show Notification</h2>
            <input type="text" id="noti-title" placeholder="Title" class="input-group">
            <input type="text" id="noti-desc" placeholder="Description" class="input-group">
            <button class="test-button" onclick="handleNotification()">Test</button>
        </div>

        <div class="action-card">
            <h2>Speak Something</h2>
            <input type="text" id="speak-input" placeholder="Input" class="input-group">
            <button class="test-button" onclick="handleSpeak()">Test</button>
        </div>
        
        <div class="action-card">
            <h2>Floating Text</h2>
            <input type="text" id="float-input" placeholder="Text" class="input-group">
            <button class="test-button" onclick="handleFloatText()">Test</button>
            <button class="test-button" onclick="triggerWebhook({trigger: 'dfloating_text'})" style="margin-top:10px; background-color: #6a1b9a;">Disable Floating Text</button>
        </div>

        <div class="action-card">
            <h2>Paste Text</h2>
            <input type="text" id="paste-input" placeholder="Text" class="input-group">
            <button class="test-button" onclick="handlePasteText()">Test</button>
            <button class="test-button" onclick="triggerWebhook({trigger: 'clear_input'})" style="margin-top:10px; background-color: #6a1b9a;">Clear Input Field</button>
        </div>

        <div class="action-card">
            <h2>DIM Screen</h2>
            <input type="number" id="dim-input" placeholder="Input (0-100)" min="0" max="100" class="input-group">
            <button class="test-button" onclick="handleDimScreen()">Test</button>
            <button class="test-button" onclick="triggerWebhook({trigger: 'dim_off'})" style="margin-top:10px; background-color: #6a1b9a;">Dim Screen Off</button>
        </div>

        <div class="action-card">
            <h2>Control Brightness</h2>
            <input type="number" id="bright-input" placeholder="Input (0-100)" min="0" max="100" class="input-group">
            <button class="test-button" onclick="handleBrightness()">Test</button>
        </div>

        <div class="action-card">
            <h2>Variable Control</h2>
            <input type="text" id="var-name" placeholder="Var Name" class="input-group">
            <input type="text" id="var-value" placeholder="Var Value" class="input-group">
            <button class="test-button" onclick="handleVariable()">Test</button>
        </div>

        <!-- Button Grid -->
        <div class="button-grid">
            <button class="button" onclick="triggerWebhook({trigger: 'recent'})">Recent</button>
            <button class="button" onclick="triggerWebhook({trigger: 'home'})">Home</button>
            <button class="button" onclick="triggerWebhook({trigger: 'back'})">Back</button>
            <button class="button" onclick="triggerWebhook({trigger: 'dnd_on'})">DND ON</button>
            <button class="button" onclick="triggerWebhook({trigger: 'dnd_off'})">DND OFF</button>
            <button class="button" onclick="triggerWebhook({trigger: 'lock_screen'})">Lock Screen</button>
            <button class="button" onclick="triggerWebhook({trigger: 'wifi_on'})">Wifi On</button>
            <button class="button" onclick="triggerWebhook({trigger: 'wifi_off'})">Wifi Off</button>
            <button class="button" onclick="triggerWebhook({trigger: 'torch'})">Torch Toggle</button>
            <button class="button" onclick="triggerWebhook({trigger: 'bt_on'})">Bluetooth On</button>
            <button class="button" onclick="triggerWebhook({trigger: 'bt_off'})">Bluetooth Off</button>
            <button class="button" onclick="triggerWebhook({trigger: 'data_on'})">Data Online</button>
            <button class="button" onclick="triggerWebhook({trigger: 'hotspot_on'})">Hotspot On</button>
            <button class="button" onclick="triggerWebhook({trigger: 'hotspot_off'})">Hotspot Off</button>
            <button class="button" onclick="triggerWebhook({trigger: 'full_volume'})">Full Volume</button>
            <button class="button" onclick="triggerWebhook({trigger: 'expand_statusbar'})">Collapse Notification Bar</button>
            <button class="button" onclick="triggerWebhook({trigger: 'ring_alarm'})">Ring Alarm At Full Volume</button>
            <button class="button" onclick="triggerWebhook({trigger: 'stop_alarm'})">Stop Alarm</button>
        </div>

        <footer class="footer">
            <p>You must install the macro and <a onclick="setMacroUrl()">Set Your Webhook URL</a> to use this Controller.</p>
            <p>Developed by ❤️ You!</p>
        </footer>
    </div>

<script>
    let baseWebhookUrl = '';

    // This function runs when the page loads
    window.onload = function() {
        baseWebhookUrl = localStorage.getItem('macroWebhookUrl');
        if (!baseWebhookUrl) {
            setMacroUrl();
        }
    };

    function setMacroUrl() {
        const url = prompt("Please enter your base MacroDroid Webhook URL:", baseWebhookUrl || "https://trigger.macrodroid.com/xxxxxxxx-xxxx...");
        if (url) {
            // Basic validation to ensure it's a MacroDroid URL
            if (url.startsWith("https://trigger.macrodroid.com/")) {
                localStorage.setItem('macroWebhookUrl', url);
                baseWebhookUrl = url;
                alert("Webhook URL saved successfully!");
            } else {
                alert("Invalid URL. It must start with 'https://trigger.macrodroid.com/'.");
            }
        }
    }

    // The main function to send the webhook request
    function triggerWebhook(params) {
        if (!baseWebhookUrl) {
            alert("Webhook URL not set. Please set it first.");
            setMacroUrl();
            return;
        }

        const queryString = new URLSearchParams(params).toString();
        const finalUrl = `${baseWebhookUrl}?${queryString}`;

        console.log("Triggering URL:", finalUrl); // For debugging
        
        // Use the Fetch API to send a "fire-and-forget" request
        fetch(finalUrl, { mode: 'no-cors' })
            .then(() => {
                console.log("Webhook triggered successfully for:", params.trigger);
                // Optional: give visual feedback
                showToast(`Triggered: ${params.trigger}`);
            })
            .catch(error => {
                console.error("Webhook trigger failed:", error);
                alert("Failed to trigger webhook. Check console for details.");
            });
    }

    // --- Handler functions for each card ---

    function handleTouch() {
        const x = document.getElementById('x-location').value;
        const y = document.getElementById('y-location').value;
        if (x && y) {
            triggerWebhook({ trigger: 'touch', x_cord: x, y_cord: y });
        } else {
            alert("Please enter both X and Y locations.");
        }
    }
    
    function handleDialog() {
        const title = document.getElementById('dialog-title').value;
        const desc = document.getElementById('dialog-desc').value;
        triggerWebhook({ trigger: 'dialog', title: title, desc: desc });
    }

    function handlePopup() {
        const input = document.getElementById('popup-input').value;
        triggerWebhook({ trigger: 'popup', input: input });
    }

    function handleNotification() {
        const title = document.getElementById('noti-title').value;
        const desc = document.getElementById('noti-desc').value;
        triggerWebhook({ trigger: 'notification', title: title, desc: desc });
    }

    function handleSpeak() {
        const input = document.getElementById('speak-input').value;
        triggerWebhook({ trigger: 'speak', input: input });
    }

    function handleFloatText() {
        const text = document.getElementById('float-input').value;
        triggerWebhook({ trigger: 'floating_text', text: text });
    }

    function handlePasteText() {
        const text = document.getElementById('paste-input').value;
        triggerWebhook({ trigger: 'paste', text: text });
    }
    
    function handleDimScreen() {
        const level = document.getElementById('dim-input').value;
        triggerWebhook({ trigger: 'dim', level: level });
    }

    function handleBrightness() {
        const level = document.getElementById('bright-input').value;
        triggerWebhook({ trigger: 'bright', level: level });
    }
    
    function handleVariable() {
        const name = document.getElementById('var-name').value;
        const value = document.getElementById('var-value').value;
        if (name) {
            triggerWebhook({ trigger: 'variable', var_name: name, var_val: value });
        } else {
            alert("Variable Name is required.");
        }
    }

    // --- Helper for feedback ---
    function showToast(message) {
        const toast = document.createElement('div');
        toast.textContent = message;
        toast.style.position = 'fixed';
        toast.style.bottom = '20px';
        toast.style.left = '50%';
        toast.style.transform = 'translateX(-50%)';
        toast.style.backgroundColor = 'rgba(0,0,0,0.7)';
        toast.style.color = 'white';
        toast.style.padding = '10px 20px';
        toast.style.borderRadius = '20px';
        toast.style.zIndex = '1000';
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.5s';
        
        document.body.appendChild(toast);
        
        setTimeout(() => { toast.style.opacity = '1'; }, 10);
        setTimeout(() => {
            toast.style.opacity = '0';
            setTimeout(() => { document.body.removeChild(toast); }, 500);
        }, 2000);
    }

</script>
</body>
</html>
